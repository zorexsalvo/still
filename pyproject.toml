[project]
name = "still"
version = "0.1.0"
description = "A local, real-time courier diary written by Gemma"
readme = "README.md"
authors = [
    { name = "Zorex Salvo", email = "zorexsalvo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30",
]

[project.scripts]
still = "still:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
