services:
  still:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TZ: UTC
      STILL_DB_PATH: /app/data/still.sqlite3
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
